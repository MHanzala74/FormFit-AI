[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formfit-ai"
version = "1.0.0"
description = "Real-time AI gym trainer and posture corrector with voice feedback (MediaPipe / YOLOv8-Pose)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MHanzala74" }]
keywords = ["pose-estimation", "mediapipe", "yolov8", "computer-vision", "fitness", "posture", "opencv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "mediapipe>=0.10",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]
web = ["streamlit>=1.30", "pandas>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
formfit = "formfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
