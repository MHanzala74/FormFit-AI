name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # MediaPipe / YOLO / TTS are imported lazily, so the test suite only needs these.
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Synthetic demo (end-to-end smoke test)
        run: python examples/synthetic_demo.py --out /tmp/demo.mp4 --report /tmp/report.json
